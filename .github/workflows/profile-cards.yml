name: Update Profile Cards

on:
  schedule:
    - cron: "15 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ==========================================================
      # REPOSITÓRIO DO PERFIL
      # ==========================================================
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      # ==========================================================
      # GITHUB STATS
      # ==========================================================
      - name: Generate GitHub Stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=00F7FF&icon_color=FF00E6&text_color=C9D1D9&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ==========================================================
      # TOP LANGUAGES
      # ==========================================================
      - name: Generate Top Languages
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=00F7FF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ==========================================================
      # GITHUB STREAK
      # ==========================================================
      - name: Generate GitHub Streak
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0D1117&ring=00F7FF&fire=FF00E6&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=00F7FF&sideLabels=C9D1D9&dates=7D8590
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # GITHUB TROPHIES
      # ==========================================================
      - name: Generate GitHub Trophies
        continue-on-error: true
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: discord

      # ==========================================================
      # SALVAR SVGs NO REPOSITÓRIO
      # ==========================================================
      - name: Commit generated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos cards."
            exit 0
          fi

          git commit -m "Update profile cards"
          git push
